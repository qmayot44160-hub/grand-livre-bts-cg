<div id="glBoot" role="status" aria-live="polite"><style>
#glBoot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#F5F7FA;color:#18202B;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .4s ease}
#glBoot.out{opacity:0;pointer-events:none}
#glBoot .bt{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
#glBoot .bi{width:112px;height:112px;border-radius:26px;background:#1E3A5F;display:grid;place-items:center;box-shadow:0 6px 20px rgba(30,58,95,.22)}
#glBoot .bn{margin:8px 0 0;font:600 1.6rem/1.15 "Source Serif 4",Georgia,serif;letter-spacing:.01em}
#glBoot .bs{margin:0;color:#59657A;font-size:.95rem}
#glBoot .bb{width:140px;height:3px;border-radius:3px;background:#D6DCE4;overflow:hidden;margin-top:10px}
#glBoot .bb i{display:block;width:40%;height:100%;border-radius:3px;background:#1E3A5F;animation:glBootBar 1.1s ease-in-out infinite}
#glBoot .bslow{display:none;margin:6px 0 0;max-width:280px;color:#59657A;font-size:.9rem}
#glBoot.slow .bslow{display:block}
#glBoot .bslow button{margin-top:10px;font:600 .92rem system-ui,sans-serif;border:0;border-radius:8px;padding:9px 16px;background:#1E3A5F;color:#fff;cursor:pointer}
@keyframes glBootBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#glBoot .bb i{animation:none;width:100%;opacity:.5}#glBoot{transition:none}}
</style><div class="bt">
<div class="bi"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h6.2A2.8 2.8 0 0 1 12 8.3V20a2.3 2.3 0 0 0-2.3-2.3H3z"/><path d="M21 5.5h-6.2A2.8 2.8 0 0 0 12 8.3V20a2.3 2.3 0 0 1 2.3-2.3H21z"/></svg></div>
<p class="bn">Grand Livre</p><p class="bs">BTS Comptabilité et Gestion</p>
<div class="bb" aria-hidden="true"><i></i></div><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Chargement du Grand Livre</span>
<div class="bslow">Le chargement prend plus de temps que d'habitude. Vérifie ta connexion.<br><button type="button" onclick="location.reload()">Recharger</button></div>
</div><script>window.glBootT=setTimeout(function(){var b=document.getElementById("glBoot");if(b)b.classList.add("slow")},12000)</script></div>
