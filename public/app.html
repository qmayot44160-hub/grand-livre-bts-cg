.cl-ps { display: grid; gap: 4px; max-width: 320px; }
.cl-cta { margin-top: 0; }

/* Signalement */
.rep-btn { justify-self: start; align-self: flex-start; border: 0; background: none; font: inherit; font-size: .82rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; min-height: 32px; }
.rep-btn:hover { color: var(--accent); }
.rep-row { margin: 0; text-align: right; }
.rep-box h2 { margin: 0; } .rep-l { font-style: italic; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.rep-ch { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.rep-ch label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius:var(--radius); cursor: pointer; }
.rep-ch label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.rep-c { display: grid; gap: 4px; font-size: .9rem; font-weight: 600; }
.rep-c textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius:var(--radius); background: var(--paper); color: var(--ink); resize: vertical; }
.rep-list { display: grid; gap: 8px; } .rep-it { display: grid; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 10px 12px; }
.rep-it small { color: var(--muted); } .rep-it span { font-size: .9rem; } .rep-it em { font-size: .88rem; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Oraux */
.or-set { display: grid; gap: 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 16px; }
.or-set .label { font-weight:600; font-size: .9rem; margin-bottom: 6px; } .or-set .btn.primary { justify-self: start; }
.or-hist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .or-hist b { margin-right: 4px; }
.or-q { font-size: 1.15rem; }
.or-clock { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 10px 0 4px; }
.or-time { font:600 3rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); }

.or-clock .bar { width: 100%; }
.or-ck { display: grid; gap: 8px; } .or-ck label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--rule); border-radius:var(--radius); cursor: pointer; }

.or-it.ko { border-left-color: var(--bad); } .or-it span { color: var(--muted); font-size: .88rem; } .or-it ul { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; }
.sit-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.sit-card { display: grid; gap: 3px; text-align: left; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 12px 14px; cursor: pointer; }
.sit-card:hover { border-color: var(--accent); } .sit-card.add { place-content: center; color: var(--accent); font-weight:600; border-style: dashed; min-height: 72px; }
.sit-form { display: grid; gap: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 16px; scroll-margin-top: 80px; }
.sit-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; } .sit-row label { display: grid; gap: 4px; font-weight:600; font-size: .9rem; }
.sit-f { display: grid; gap: 3px; } .sit-f span { font-size: .85rem; }
@media (max-width: 640px) { .sit-row { grid-template-columns: minmax(0, 1fr); } .or-time { font-size: 2.6rem; } }

/* Sauvegarde et hors connexion */

.bk-err { margin: 0; padding: 10px 16px; color: var(--bad); background: var(--bad-bg); }
.file-btn { cursor: pointer; }

/* Effets : tampon, XP, niveau, visite, réponses, anneaux */
.fx-stamp { position: fixed; inset: 0; z-index: 210; display: grid; place-items: center; pointer-events: none; }
.fx-stamp span { display: grid; justify-items: center; gap: 2px; padding: 10px 26px 12px; border: 5px solid #c23a46; border-radius:var(--radius); color: #c23a46; background: color-mix(in srgb, var(--sheet) 70%, transparent); transform: rotate(-12deg);  box-shadow: inset 0 0 0 2px color-mix(in srgb, #c23a46 35%, transparent); animation: stampIn .5s cubic-bezier(.2, 1.4, .4, 1) both, stampOut .35s ease-in 1.2s forwards; mix-blend-mode: multiply; }
.fx-stamp b { font:600 2.4rem/1 var(--f-display, inherit);  } .fx-stamp small { font-weight:600;  font-size: .78rem; }
:root[data-theme="dark"] .fx-stamp span { mix-blend-mode: normal; color: #ff7b86; border-color: #ff7b86; }
@keyframes stampIn { 0% { opacity: 0; transform: rotate(-12deg) scale(2.4); } 60% { opacity: 1; transform: rotate(-12deg) scale(.92); } 100% { opacity: 1; transform: rotate(-12deg) scale(1); } }
@keyframes stampOut { to { opacity: 0; transform: rotate(-12deg) scale(1.05); } }
.fx-xp { position: fixed; z-index: 220; pointer-events: none; transform: translate(0, 0); margin: -14px 0 0 -30px; font-weight:600; color: #8a5a00; background: #fff3d6; border: 1px solid #f0cf7a; border-radius:var(--radius); padding: 3px 10px; font-size: .9rem; box-shadow: 0 6px 18px rgba(0,0,0,.15); transition: transform .8s cubic-bezier(.5, 0, .3, 1), opacity .8s ease-in; white-space: nowrap; }
.who.bump { animation: whoBump .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes whoBump { 40% { transform: scale(1.12); } }
.fx-lvl { position: fixed; inset: 0; z-index: 205; display: grid; place-items: center; padding: 16px; background: rgba(10, 14, 30, .62); animation: wkIn .25s ease; }
.fx-lvl-box { display: grid; justify-items: center; gap: 16px; text-align: center; color: #fff; max-width: 420px; }
.fx-lvl-card { width: min(320px, 82vw); aspect-ratio: 1.6; perspective: 1200px; }
.fx-lvl-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: lvlFlip 1s cubic-bezier(.3, 1.3, .4, 1) .45s both; }
.fx-lvl.still .fx-lvl-in { animation: none; transform: rotateY(180deg); }
.fx-lvl-f, .fx-lvl-b { position: absolute; inset: 0; border-radius:var(--radius); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-content: center; justify-items: center; gap: 4px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
.fx-lvl-f { background: var(--hero-bg); color: #fff; } .fx-lvl-f span {   font-size: .8rem; opacity: .85; } .fx-lvl-f b { font-size: 3.4rem; line-height: 1; } .fx-lvl-f small { opacity: .8; }
.fx-lvl-b { transform: rotateY(180deg); background: #fffaf0; color: #1d2340; border: 1px solid #e8d9b0; padding: 16px; }
.fx-lvl-b h2 { margin: 2px 0; font-size: 1.5rem; } .fx-lvl-b p { margin: 0; font-weight: 600; } .fx-lvl-b small { color: #8a7a55; font-size: .78rem;   } .fx-lvl-b .eyebrow { color: #b07a00; }
.fx-lvl-msg { margin: 0; font-size: 1rem; } .fx-lvl-msg b { color: var(--gold); }
@keyframes lvlFlip { from { transform: rotateY(0) scale(.6); } 40% { transform: rotateY(0) scale(1); } to { transform: rotateY(180deg) scale(1); } }
.tour { position: fixed; inset: 0; z-index: 190; }
.tour-hole { position: fixed; border-radius:var(--radius); box-shadow: 0 0 0 9999px rgba(10, 14, 30, .55); transition: all .3s ease; pointer-events: none; outline: 2px solid var(--gold); outline-offset: 2px; }
.tour-tip { position: fixed; background: var(--sheet); color: var(--ink); border-radius:var(--radius); padding: 14px 16px; display: grid; gap: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.3); animation: gsPop .25s ease both; }
.tour-tip p { margin: 0; font-size: .92rem; color: var(--muted); } .tour-tip .row { justify-content: flex-end; margin-top: 4px; }
.opt.wrong { animation: optShake .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes optShake { 15%, 85% { transform: translateX(-2px); } 30%, 70% { transform: translateX(5px); } 45%, 55% { transform: translateX(-7px); } }
.opt.right { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); animation: optPop .45s cubic-bezier(.2, .9, .3, 1.3), optGlow 1s ease-out .1s; }
@keyframes optGlow { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } to { box-shadow: 0 0 0 14px transparent; } }
.feedback .verdict { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); display: inline-block; }
.pf-mat-r { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "c n r" "v v r"; }
.pf-ring { grid-area: r; width: 58px; height: 58px; transform: rotate(-90deg); }
.pr-bg { fill: none; stroke: var(--rule); stroke-width: 5; }
.pr-fg { fill: none; stroke-width: 5; stroke-linecap: round; animation: ringIn 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.pr-fg.l { stroke: hsl(var(--h) var(--s) 48%); } .pr-fg.w { stroke: #f0c55c; } .pr-fg.m { stroke: #c58a10; }
.pf-mat-r:nth-child(2) .pr-fg { animation-delay: .06s; } .pf-mat-r:nth-child(3) .pr-fg { animation-delay: .12s; } .pf-mat-r:nth-child(4) .pr-fg { animation-delay: .18s; } .pf-mat-r:nth-child(n+5) .pr-fg { animation-delay: .24s; }
.no-motion .fx-xp { display: none; }
@media (prefers-reduced-motion: reduce) { .fx-xp { display: none; } .fx-stamp span, .fx-lvl-in, .tour-hole, .opt.wrong, .opt.right, .pr-fg { animation: none !important; transition: none !important; } .fx-lvl-in { transform: rotateY(180deg); } }

/* Séance, équilibre, auto-évaluation des annales */
.plan-go { justify-self: start; margin-top: 4px; }
.ex-tab-ic { display: inline-flex; } .ex-tab-ic .svg { width: 20px; height: 20px; }
.wk-ic .svg { width: 26px; height: 26px; color: #c58a10; }
.wk-opt b, .wk-read > b { display: inline-flex; align-items: center; gap: 8px; } .wk-opt b .svg, .wk-read > b .svg { color: var(--accent); }
.bal { display: grid; gap: 8px; }
.bal-r { display: grid; grid-template-columns: 34px minmax(0, 1.2fr) minmax(0, 1fr) 104px; align-items: center; gap: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 8px 12px; }
.bal-r.low { border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }

.bal-b.me, .bal-key i.me { background: var(--accent); } .bal-b.w, .bal-key i.w { background: color-mix(in srgb, var(--muted) 45%, transparent); }
.bal-r.low .bal-b.me { background: var(--bad); }
.bal-n { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; font-weight:600; } .bal-n small { color: var(--muted); font-weight: 400; }
.bal-key { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin: 0; } .bal-key span { display: inline-flex; align-items: center; gap: 6px; } .bal-key i { display: inline-block; width: 14px; height: 7px; border-radius:var(--radius); }
.bal-tip { margin: 0; padding: 10px 12px; border-radius:var(--radius); background: var(--bad-bg); } .bal-tip.ok { background: var(--ok-bg); }
@media (max-width: 640px) { .bal-r { grid-template-columns: 30px minmax(0, 1fr) 96px; } .bal-t { display: none; } }
.ann-gridev { border: 1px solid var(--rule); border-radius:var(--radius); padding: 10px 14px; margin-top: 12px; background: var(--sheet); }
.ann-gridev summary { cursor: pointer; font-weight:600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ag-list { display: grid; gap: 10px; padding-left: 20px; margin: 10px 0; } .ag-list li span { display: block; margin-bottom: 6px; }
.ag-b { display: flex; flex-wrap: wrap; gap: 6px; }
.ag-o { font: inherit; font-size: .85rem; padding: 5px 12px; min-height: 34px; border-radius:var(--radius); border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); cursor: pointer; }
.ag-o.v2[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight:600; }
.ag-o.v1[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 18%, transparent); border-color: var(--gold); font-weight:600; }
.ag-o.v0[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight:600; }
.ag-res { display: grid; gap: 6px; }

/* Onglets de la page S'entraîner */
.ex-tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 64px)); z-index: 6; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; padding: 8px 0; margin: -4px 0 4px; background: var(--paper); }
.ex-tab { display: grid; gap: 2px; justify-items: start; text-align: left; font: inherit; color: var(--ink); cursor: pointer; background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 10px 12px; min-height: 44px; }
.ex-tab:hover { border-color: var(--accent); }
.ex-tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-tab[aria-current="page"] small { color: inherit; opacity: .85; }
.ex-tab-ic { font-size: 1.2rem; line-height: 1; } .ex-tab b { font-size: .95rem; } .ex-tab small { color: var(--muted); font-size: .78rem; }
@media (max-width: 760px) {
  .ex-tabs { display: flex; overflow-x: auto; scroll-snap-type: x proximity; margin-left: -16px; margin-right: -16px; padding: 8px 16px; scrollbar-width: none; }
  .ex-tabs::-webkit-scrollbar { display: none; }
  .ex-tab { flex: 0 0 auto; scroll-snap-align: start; grid-template-columns: auto auto; align-items: center; column-gap: 6px; padding: 8px 12px; border-radius:var(--radius); }
  .ex-tab small { display: none; }
}

/* Cahier des erreurs et choix des points faibles */
.eb-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.eb-sum > div { background: var(--sheet); border: 1px solid var(--rule); border-radius:var(--radius); padding: 10px 12px; display: grid; gap: 2px; }
.eb-sum b { font-size: 1.4rem; font-variant-numeric: tabular-nums; } .eb-sum span { color: var(--muted); font-size: .85rem; }
.eb-bar { display: grid; gap: 8px; } .eb-fl { display: flex; flex-wrap: wrap; gap: 6px; }
.eb-f { font: inherit; font-size: .86rem; padding: 5px 12px; border-radius:var(--radius); border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); cursor: pointer; min-height: 32px; }
.eb-f.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.eb-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius:var(--radius); background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: .86rem; font-weight: 600; }
.eb-tag button { border: 0; background: none; font: inherit; font-size: 1.1rem; cursor: pointer; color: inherit; padding: 0 6px; }
.eb-it { border-left: 4px solid hsl(var(--h) var(--s) 48%); }
.eb-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .eb-h small { color: var(--muted); flex: 1; min-width: 140px; }
.eb-n { font-size: .8rem; font-weight:600; color: var(--bad); } .eb-st { font-size: .76rem; font-weight:600; padding: 2px 8px; border-radius:var(--radius); }
.eb-st.ko { color: var(--bad); background: var(--bad-bg); } .eb-st.ok { color: var(--ok); background: var(--ok-bg); }
@media (max-width: 640px) { .eb-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.wk-sheet { position: fixed; inset: 0; z-index: 80; background: rgba(10, 14, 24, .45); display: flex; align-items: center; justify-content: center; padding: 16px; animation: wkIn .15s ease; }
@keyframes wkIn { from { opacity: 0; } }
.wk-box { position: relative; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--sheet); color: var(--ink); border-radius:var(--radius); padding: 22px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: grid; gap: 10px; }
.wk-box h2 { margin: 0; font-size: 1.2rem; padding-right: 30px; } .wk-box p { margin: 0; }
.wk-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
.wk-opts { display: grid; gap: 8px; }
.wk-opt { display: grid; gap: 3px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius:var(--radius); padding: 12px 14px; }
.wk-opt:hover:not([disabled]) { border-color: var(--accent); } .wk-opt[disabled] { opacity: .5; cursor: not-allowed; }
.wk-opt span { color: var(--muted); font-size: .88rem; }
.wk-read { display: grid; gap: 6px; } .wk-read > div { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 640px) { .wk-sheet { align-items: flex-end; padding: 0; } .wk-box { border-radius:var(--radius) var(--radius) 0 0; width: 100%; padding-bottom: calc(20px + env(safe-area-inset-bottom)); } }


/* Calculs express */
