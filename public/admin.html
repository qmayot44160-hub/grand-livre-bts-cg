<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GL Admin</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/admin.webmanifest">
<meta name="theme-color" content="#161a36" id="themeColor">
<link rel="apple-touch-icon" href="/admin-192.png">
<link rel="icon" href="/admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GL Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<script>try{var p=JSON.parse(localStorage.getItem("gl-admin-pref")||"{}");if(p.theme==="dark"||p.theme==="light")document.documentElement.setAttribute("data-theme",p.theme);}catch(e){}</script>
<style>
:root{--paper:#F5F7FA;--sheet:#FFFFFF;--ink:#18202B;--muted:#59657A;--rule:#D6DCE4;--rule-strong:#C3CBD6;--accent:#1E3A5F;--accent-soft:#E8EDF4;--accent-ink:#FFFFFF;--ok:#1F7A4D;--ok-bg:#E6F2EC;--bad:#B42318;--bad-bg:#FBEAE8;--warn:#8A5A12;--warn-bg:#F7EFE1;--gold:#B7791F;--top:#1E3A5F;--top-2:#1E3A5F;
--lift:0 0 0 1px var(--rule);--l-strong:38%;--l-soft:95.5%;--l-mid:87%;
--f-display:"Source Serif 4",Georgia,serif;--f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;--f-mono:"Source Sans 3","Segoe UI",system-ui,sans-serif;color-scheme:light}
:root{--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121821;--sheet:#1A2230;--ink:#E6EBF2;--muted:#9AA6B8;--rule:#2B3546;--rule-strong:#3A4659;--accent:#9DB8DC;--accent-soft:#1F2A3B;--accent-ink:#121821;--ok:#5CC28F;--ok-bg:#16302A;--bad:#F2867B;--bad-bg:#3A1F1E;--warn:#E0A84A;--warn-bg:#33281A;--lift:0 0 0 1px var(--rule);--l-strong:74%;--l-soft:19%;--l-mid:31%;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121821;--sheet:#1A2230;--ink:#E6EBF2;--muted:#9AA6B8;--rule:#2B3546;--rule-strong:#3A4659;--accent:#9DB8DC;--accent-soft:#1F2A3B;--accent-ink:#121821;--ok:#5CC28F;--ok-bg:#16302A;--bad:#F2867B;--bad-bg:#3A1F1E;--warn:#E0A84A;--warn-bg:#33281A;--lift:0 0 0 1px var(--rule);--l-strong:74%;--l-soft:19%;--l-mid:31%;color-scheme:dark}
[style*="--h"]{--c:hsl(var(--h,228) var(--s,60%) var(--l-strong));--c-soft:hsl(var(--h,228) calc(var(--s,60%) + 10%) var(--l-soft));--c-mid:hsl(var(--h,228) var(--s,60%) var(--l-mid))}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.4rem}h3{font-size:1.05rem}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.86rem}.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.svg{width:20px;height:20px;flex:none}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--muted)}

/* En-tête */
header.top{position:sticky;top:0;z-index:30;background:var(--top);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
header.top .hi{flex:1;min-width:0}
header.top .hi b{display:block;font:600 1.12rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .hi span{font-size:.8rem;opacity:.75;text-transform:capitalize}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:var(--radius);width:40px;height:40px;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .15s}
.icon-btn:active{transform:scale(.92)}.icon-btn .svg{width:20px;height:20px}
.icon-btn.spin .svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.me-btn{border:2px solid rgba(255,255,255,.35);padding:0;width:40px;height:40px;border-radius:50%;cursor:pointer;background:none}

main{max-width:860px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom));display:grid;gap:16px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;display:grid;gap:12px;min-width:0;box-shadow:var(--lift)}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec-head{display:grid;gap:2px}.sec-head p{color:var(--muted);font-size:.92rem}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--radius);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .12s,box-shadow .15s,background .15s;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 8px 20px -10px var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--rule))}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.in,select.in{width:100%;padding:11px 13px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);min-height:46px}
input.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* Tuiles chiffrées */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;background:var(--sheet);display:grid;gap:2px;position:relative;overflow:hidden}
.kpi b{font:600 1.6rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem;font-weight:600}
.kpi i{position:absolute;right:10px;top:10px;color:var(--accent);opacity:.55}.kpi i .svg{width:18px;height:18px}
.kpi.alert b{color:var(--bad)}.kpi.good b{color:var(--ok)}

/* Héros */
.hero{background:var(--top);color:#fff;border-radius:var(--radius);padding:18px;display:grid;gap:14px;position:relative;overflow:hidden;}
.hero::after{content:none}
.hero h2{color:#fff;font-size:1.5rem}.hero p{opacity:.8}
.rings{display:flex;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.15)}.card .ring .bg,.sheet .ring .bg{stroke:var(--rule)}
.ring .fg{stroke-linecap:round;stroke:var(--gold);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .fg.good{stroke:var(--ok)}.ring .fg.mid{stroke:var(--gold)}.ring .fg.low{stroke:var(--bad)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .t b{font:600 1.6rem/1 var(--f-display)}.ring .t span{font-size:.72rem;font-weight:600;opacity:.8;margin-top:3px;max-width:84px}
.ring-wrap{display:grid;justify-items:center;gap:6px;font-size:.82rem;font-weight:600}

/* Graphiques */
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;padding-top:6px}
.bars i{flex:1;background:var(--accent);border-radius:var(--radius) var(--radius) 0 0;min-height:3px;transform-origin:bottom;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.bars i.today{background:var(--gold)}
.bars-lbl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-weight:600}
.meter{height:9px;border-radius:var(--radius);background:var(--rule);overflow:hidden;flex:1;min-width:60px}
.meter i{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:var(--radius);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:.9rem;padding:3px 0}
.use{display:grid;grid-template-columns:minmax(118px,auto) 1fr auto;gap:12px;align-items:center;font-size:.9rem;padding:4px 0}
.use b{font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}.use b em{font-style:normal;width:22px;text-align:center}
.use small{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}
.use.none{opacity:.55}
.who-uses{display:grid;gap:6px;margin-top:4px}
.wu{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius);padding:8px 10px;color:inherit;font:inherit;cursor:pointer}
.wu .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.wu .chips span{font-size:.72rem;font-weight:600;border-radius:var(--radius);padding:1px 7px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ftile{border:1px solid var(--rule);border-radius:var(--radius);padding:9px 11px;display:grid;gap:1px;background:var(--sheet)}
.ftile span{font-size:.8rem;font-weight:600;color:var(--muted)}.ftile b{font:600 1.3rem/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.ftile small{color:var(--muted);font-size:.74rem}.ftile.off b{color:var(--muted);opacity:.6}.ftile.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.gbar{display:flex;gap:8px;align-items:center}.gbar select.in{min-height:40px;padding:7px 11px;flex:1;min-width:0;font-weight:600}
.gbar .btn{flex:none}
.cview{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.regbar{display:flex;height:14px;border-radius:var(--radius);overflow:hidden;background:var(--rule)}.regbar i{display:block;height:100%}
.reglg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:.84rem;margin-top:8px}.reglg span{display:flex;align-items:center;gap:6px}.reglg b{font-variant-numeric:tabular-nums;margin-left:auto}
.reglg em{width:10px;height:10px;border-radius:0;display:inline-block}
.coh{width:100%;border-collapse:separate;border-spacing:3px;font-size:.84rem}.coh th{font-weight:600;color:var(--muted);text-align:center;font-size:.76rem}.coh th:first-child{text-align:left}
.coh td{text-align:center;border-radius:var(--radius);padding:6px 2px;font-variant-numeric:tabular-nums;font-weight:600}.coh td:first-child{text-align:left;font-weight:600;padding-left:0}
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.trend div{border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px}.trend b{display:block;font:600 1.15rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}.trend span{font-size:.76rem;color:var(--muted);font-weight:600}.trend small{font-size:.74rem;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}
.chrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}.chrow:first-of-type{border-top:0}
.chrow .t{font-size:.88rem;font-weight:600;min-width:0}.chrow .mt{grid-column:2/4;display:flex;gap:10px;align-items:center}.chrow small{color:var(--muted);font-size:.76rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.gcard{border:1px solid var(--rule);border-radius:var(--radius);padding:12px;display:grid;gap:8px;background:var(--sheet)}.gcard.off{opacity:.6}
.gcode{font:600 1.5rem/1 var(--f-mono);letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--accent);user-select:all}
.xrow{display:flex;gap:8px;flex-wrap:wrap}.xrow .btn{flex:1;min-width:140px}
#print{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important;color:#111!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;font:10.5pt/1.4 "Source Sans 3",system-ui,sans-serif;color:#111}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1E3A5F;padding-bottom:6px;margin-bottom:12px}
  #print header h1{font-size:17pt;margin:0;color:#1E3A5F}#print header p{margin:2px 0 0;color:#555;font-size:9.5pt}
  #print header .brand{font-weight:600;color:#1E3A5F;text-align:right;font-size:9.5pt}
  #print h1,#print h2{font-family:"Source Serif 4",Georgia,serif}#print h2{font-size:12pt;color:#1E3A5F;margin:14px 0 6px;break-after:avoid}
  #print section{break-inside:avoid}
  #print .pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #print .pk div{border:1px solid #D6DCE4;border-radius:var(--radius);padding:6px 8px}#print .pk b{display:block;font-size:14pt}#print .pk span{color:#555;font-size:8.5pt}
  #print table{width:100%;border-collapse:collapse;font-size:9pt}
  #print th{background:#E8EDF4;text-align:left;font-weight:600;color:#1E3A5F}
  #print th,#print td{border:1px solid #D6DCE4;padding:3px 6px;vertical-align:top}
  #print td.n,#print th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #print tr{break-inside:avoid}
  #print .bar{display:inline-block;height:7px;border-radius:0;background:#1E3A5F;vertical-align:middle;margin-right:5px}
  #print .pheat{display:flex;gap:3px}#print .pheat i{display:block;width:14px;height:14px;border-radius:0;background:#E8EDF4}#print .pheat i.on{background:#1E3A5F}
  #print .note{color:#555;font-size:8.5pt;margin:4px 0 0}
  #print footer{margin-top:16px;border-top:1px solid #ccc;padding-top:4px;color:#777;font-size:8pt}
  #print .warn{color:#8A5A12;font-weight:600}#print .bad{color:#B42318;font-weight:600}#print .ok{color:#1F7A4D;font-weight:600}
}
.mrow .lab{display:flex;align-items:center;gap:8px;min-width:0}
.tabcode{display:inline-grid;place-items:center;min-width:44px;height:26px;padding:0 8px;border-radius:var(--radius);background:var(--c,var(--accent));color:#fff;font:600 .76rem/1 var(--f-mono);letter-spacing:.02em}
:root[data-theme="dark"] .tabcode{color:#12142a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabcode{color:#12142a}}
.spark{width:84px;height:26px;display:block}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:var(--radius);background:var(--rule);transform:scale(.6);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),opacity .35s}
.heat.in i{transform:none;opacity:1}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--rule))}.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--rule))}.heat i.l3{background:var(--accent)}
.heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}

/* Listes */
.list{display:grid;gap:10px}
.stu{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:var(--lift)}
.stu:hover{transform:translateY(-2px);border-color:var(--rule-strong)}
.stu:active{transform:scale(.985)}
.stu.off{opacity:.65}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 .95rem var(--f-display);color:#fff;background:hsl(var(--ah,228) 35% 38%);flex:none;position:relative}
.av.big{width:72px;height:72px;font-size:1.5rem;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.av .dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--sheet)}
.stu .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stu .sub{color:var(--muted);font-size:.82rem}
.stu .rt{text-align:right;display:grid;justify-items:end;gap:2px}
.stu .rt b{font:600 1.05rem var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:var(--radius);padding:1px 8px;font-size:.72rem;font-weight:600;border:1px solid var(--rule);white-space:nowrap}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--radius);padding:7px 13px;font-weight:600;font-size:.86rem;cursor:pointer;transition:background .15s,color .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:transparent}
.chip .n{opacity:.7;margin-left:4px}
.searchbar{position:relative}.searchbar .svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar input{padding-left:40px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{display:grid;justify-items:center;gap:6px;text-align:center;border:0;background:none;cursor:pointer;padding:0;min-width:0}
.pod .stand{width:100%;border-radius:var(--radius) var(--radius) var(--radius) var(--radius);background:var(--accent-soft);display:grid;place-items:center;font:600 1.2rem var(--f-display);color:var(--accent);transform-origin:bottom}
.pod:nth-child(1) .stand{height:58px}.pod:nth-child(2) .stand{height:80px;background:color-mix(in srgb,var(--gold) 40%,var(--sheet));color:var(--warn)}.pod:nth-child(3) .stand{height:44px}
.pod b{font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{color:var(--muted);font-size:.74rem;font-weight:600}
.watch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.watch:first-of-type{border-top:0}
.watch .av{width:34px;height:34px;font-size:.78rem}

/* Signalements */
.rep{border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;display:grid;gap:6px;background:var(--sheet);box-shadow:var(--lift);transition:opacity .3s,transform .35s,max-height .4s,margin .4s,padding .4s;max-height:600px;overflow:hidden}
.rep.done{opacity:.6}
.rep.leaving{opacity:0;transform:translateX(40px);max-height:0;padding-top:0;padding-bottom:0;margin-top:-10px}
.rep-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:600}
.kind{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius);padding:2px 8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.76rem}
.kind .svg{width:14px;height:14px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;display:grid;gap:6px;justify-items:center}
.empty .big{font-size:2.4rem}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--sheet) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .ind{position:absolute;top:6px;height:52px;border-radius:var(--radius);background:var(--accent-soft);transition:transform .35s cubic-bezier(.3,.8,.3,1.05),width .35s;z-index:0;left:0}

    if (i.dataset.eye) return; i.dataset.eye = "1";
    if (i.parentNode.querySelector(".eye,.pw-eye")) return; /* la page a déjà son propre œil */
    var w = i.parentNode;
    if (!w.classList.contains("field")) { w = document.createElement("span"); w.className = "pw-wrap"; i.parentNode.insertBefore(w, i); w.appendChild(i); }
    else i.style.paddingRight = "46px";
    var b = document.createElement("button"); b.type = "button"; b.className = "pw-eye"; b.innerHTML = EYE;
    b.setAttribute("aria-label", "Afficher le mot de passe"); b.setAttribute("aria-pressed", "false");
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("click", function () { var show = i.type === "password"; i.type = show ? "text" : "password"; b.innerHTML = show ? NOEYE : EYE; b.setAttribute("aria-pressed", String(show)); b.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe"); i.focus(); });
    w.appendChild(b);
    var f = i.form; if (f && !f.dataset.eyeReset) { f.dataset.eyeReset = "1"; f.addEventListener("submit", function () { f.querySelectorAll("input[data-eye]").forEach(function (x) { if (x.type === "text") { x.type = "password"; var bb = x.parentNode.querySelector(".pw-eye"); if (bb) { bb.innerHTML = EYE; bb.setAttribute("aria-pressed", "false"); } } }); }, true); }
  }
  function scan() { document.querySelectorAll('input[type="password"]:not([data-eye])').forEach(add); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan); else scan();
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
